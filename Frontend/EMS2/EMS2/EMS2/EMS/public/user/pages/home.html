<div class="home-container">

    <h2 class="home-title">Welcome, user!</h2>

    <section class="recently-used">
    <h3>Recently Used:</h3>
    <div id="recently-used-cards" class="recent-cards">
    </div>
    </section>

    

    <!-- Chatbot -->
    <div id="chatbot-container">
        <div id="chatbot-box" class="hidden">
            <div id="chatbot-header">
                <h4>🤖 EMS Assistant</h4>
                <button id="chatbot-close">✕</button>
            </div>
            <div id="chatbot-messages">
                <div class="chat-msg bot">Hello! I am your EMS Assistant. How can I help you today? 😊</div>
            </div>
            <div id="chatbot-input-area">
                <input id="chatbot-input" type="text" placeholder="Ask anything..." />
                <button id="chatbot-send">➤</button>
            </div>
        </div>
        <div class="chatbot-icon" id="chatbot-toggle">💬 Chatbot</div>
    </div>
</div>
<script src="/user/js/chatbot.js"></script>
