<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Attendance</title>

    <!-- LOAD AFTER ALL OTHER CSS -->
    <link rel="stylesheet" href="../css/attendance.css">
</head>
<body>

<div id="attendance-page">

    <h2>My Attendance</h2>

    <!-- Filters -->
    <div class="att-filters">
        <div>
            <label>Employee</label>
            <div class="static-entry">
    EMP001 - emp
</div>
        </div>

        <div>
            <label>Month</label>
            <select>
                <option>January 2026</option>
                <option>February 2026</option>
                    <option>March 2026</option>
                        <option>April 2026</option>
                            <option>May 2026</option>
            </select>
        </div>
    </div>

    <!-- SUMMARY BLOCKS -->
    <div class="att-summary">
        <div class="att-card">
            <p>Present Days</p>
            <h3>22</h3>
        </div>
        <div class="att-card">
            <p>Absent Days</p>
            <h3>1</h3>
        </div>
        <div class="att-card">
            <p>Leave Days</p>
            <h3>2</h3>
        </div>
        <div class="att-card">
            <p>Working Days</p>
            <h3>25</h3>
        </div>
    </div>

    <!-- TABLE -->
    <table class="att-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Day</th>
                <th>Status</th>
                <th>Check In</th>
                <th>Check Out</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>01 Jan 2026</td>
                <td>Thursday</td>
                <td class="present">Present</td>
                <td>09:05 AM</td>
                <td>06:02 PM</td>
            </tr>
            <tr>
                <td>03 Jan 2026</td>
                <td>Saturday</td>
                <td class="absent">Absent</td>
                <td>-</td>
                <td>-</td>
            </tr>
            <tr>
                <td>05 Jan 2026</td>
                <td>Friday</td>
                <td class="present">Present</td>
                <td>09:05 AM</td>
                <td>06:00 PM</td>
            </tr>
            <tr>
                <td>09 Jan 2026</td>
                <td>Monday</td>
                <td class="present">Present</td>
                <td>09:05 AM</td>
                <td>05:30 PM</td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
