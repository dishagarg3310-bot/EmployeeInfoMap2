<div class="profile-page">

  <h2 class="profile-title">My Profile</h2>

  <!-- Profile Image -->
  <div class="profile-image-wrapper">
    <img
      id="profileImage"
      src="../assets/images/admin.jpg"
      class="profile-image"
      alt="HR"
      title="Click to upload photo (during edit mode)"
    />
    <input
      type="file"
      id="imageInput"
      accept="image/*"
      hidden
    />
    <p style="font-size: 12px; color: #666; text-align: center; margin-top: 5px;">
      Click photo to upload (max 2MB)
    </p>
  </div>

  <!-- Buttons -->
  <div class="profile-actions">
    <button type="button" id="editProfileBtn" class="btn primary-btn">
      ✏️ Edit Profile
    </button>
    <button type="button" id="saveProfileBtn" class="btn primary-btn" style="display: none; background-color: #28a745;">
      💾 Save Changes
    </button>
    <button type="button" id="cancelProfileBtn" class="btn primary-btn" style="display: none; background-color: #6c757d;">
      ❌ Cancel
    </button>
  </div>

  <!-- Profile Form -->
  <form id="profileForm" class="profile-form">

    <div class="form-group">
      <label>HR ID</label>
      <input id="hrId" type="text" disabled />
    </div>

    <div class="form-group">
      <label>Username</label>
      <input id="username" type="text" disabled />
    </div>

    <div class="form-group">
      <label>Name</label>
      <input id="name" type="text" />
    </div>

    <div class="form-group">
      <label>Role</label>
      <input id="role" type="text" disabled />
    </div>

    <div class="form-group">
      <label>Department</label>
      <input id="department" type="text" />
    </div>

    <div class="form-group">
      <label>Contact</label>
      <input id="contact" type="text" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input id="email" type="email" />
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea id="address"></textarea>
    </div>

  </form>

</div>

<script src="../js/profile.js"></script>
